name: Deploy Codewalk

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308670323544:role/codewalk-github-deploy
          aws-region: ap-south-1

      - run: aws s3 sync dist/ s3://manujagrawal-codewalk-2026/ --delete

      - run: aws cloudfront create-invalidation --distribution-id E2RQGS35ZTK9NC --paths "/*"
